# STATUS: written but not run in the build environment. First run:  docker compose -f deploy/docker-compose.yml --env-file .env up --build
# Create the broker password file first:
#   docker run --rm -v ${PWD}/deploy/mosquitto:/mosquitto/config eclipse-mosquitto:2 \
#     mosquitto_passwd -b -c /mosquitto/config/passwd ingest <MQTT_PASSWORD>   (and one user per node, e.g. node01)
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto:/mosquitto/config"]
    restart: unless-stopped
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    ports: ["8000:8000"]
    volumes: ["data:/data"]
    restart: unless-stopped
  ingest:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: python -m manas_backend.cli ingest
    env_file: ../.env
    volumes: ["data:/data"]
    depends_on: [mosquitto]
    restart: unless-stopped
  bot:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: python -m swati_bot.bot
    env_file: ../.env
    volumes: ["data:/data"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  data:
